<!DOCTYPE html>
<html>
<head>
    <title>Dictionary Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 4px; }
        .log { background: #f8f9fa; padding: 20px; border-radius: 4px; margin: 20px 0; height: 400px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Jitendex Dictionary Test</h1>

    <input type="file" id="fileInput" accept=".zip">
    <button id="importTestBtn">Import Dictionary & Test</button>
    <button id="testOnlyBtn">Test Lookup Only</button>

    <div id="log" class="log"></div>

    <script type="module">
        import { YomitanDictionaryService } from '../services/yomitan-dictionary-service.js';

        let service;
        const log = document.getElementById('log');
        const importTestBtn = document.getElementById('importTestBtn');
        const testOnlyBtn = document.getElementById('testOnlyBtn');
        const fileInput = document.getElementById('fileInput');

        function logger(msg) {
            log.innerHTML += new Date().toLocaleTimeString() + ': ' + msg + '\n';
            log.scrollTop = log.scrollHeight;
            console.log(msg);
        }

        async function importAndTest() {
            try {
                importTestBtn.disabled = true;
                importTestBtn.textContent = '⏳ Running...';

                logger('🚀 Initializing service...');
                service = new YomitanDictionaryService();
                await service.init();
                logger('✅ Service initialized');

                const file = fileInput.files[0];
                if (file) {
                    logger(`📥 Importing ${file.name}...`);
                    await service.importDictionary(file);
                    logger('✅ Dictionary imported!');
                }

                await testLookups();
                logger('🎉 Test completed!');
            } catch (error) {
                logger(`❌ Error: ${error.message}`);
            } finally {
                importTestBtn.disabled = false;
                importTestBtn.textContent = 'Import Dictionary & Test';
            }
        }

        async function testLookupOnly() {
            try {
                testOnlyBtn.disabled = true;
                testOnlyBtn.textContent = '⏳ Testing...';

                if (!service) {
                    logger('🚀 Initializing service...');
                    service = new YomitanDictionaryService();
                    await service.init();
                    logger('✅ Service initialized');
                }

                await testLookups();
                logger('🎉 Test completed!');
            } catch (error) {
                logger(`❌ Error: ${error.message}`);
            } finally {
                testOnlyBtn.disabled = false;
                testOnlyBtn.textContent = 'Test Lookup Only';
            }
        }

        async function testLookups() {
            logger('🔍 Testing lookups...');

            const words = ['猫', '食べる', '本', '勉強'];

            for (const word of words) {
                const results = await service.lookupTerms([word]);
                const entries = results.get(word) || [];

                if (entries.length > 0) {
                    logger(`✅ ${word}: ${entries.length} definitions found`);
                    const entry = entries[0];
                    const term = entry.term || entry.expression;
                    const reading = entry.reading || '';
                    const defs = entry.definitions || entry.glossary || [];
                    const defText = Array.isArray(defs) && defs.length > 0 ?
                        (typeof defs[0] === 'string' ? defs.slice(0, 2).join(', ') : 'Complex definition') :
                        'No definition text';
                    logger(`   ${term} (${reading}) - ${defText}`);
                } else {
                    logger(`❌ ${word}: No definitions found`);
                }
            }
        }

        // Event handlers
        importTestBtn.addEventListener('click', importAndTest);
        testOnlyBtn.addEventListener('click', testLookupOnly);

        // File selection enables import button (similar to test-simple.html)
        fileInput.addEventListener('change', (e) => {
            const hasFile = e.target.files[0];
            if (hasFile) {
                logger(`📁 Selected file: ${hasFile.name} (${(hasFile.size / 1024 / 1024).toFixed(1)} MB)`);
            }
        });

        logger('📝 Dictionary test ready! Select jitendx-yomitan.zip and click Import & Test');
    </script>
</body>
</html>
